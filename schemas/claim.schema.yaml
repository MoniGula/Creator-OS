$schema: https://json-schema.org/draft/2020-12/schema
title: Claim
type: object
required:
- id
- created_at
- privacy
- status
- claim
- claim_type
- review_state
properties:
  id:
    type: string
    pattern: ^[A-Z]{2,4}-[0-9]{3,}$
  created_at:
    type: string
    format: date-time
  updated_at:
    type:
    - string
    - 'null'
    format: date-time
  privacy:
    enum:
    - private
    - internal
    - shareable
    - public
  status:
    type: string
  tags:
    type: array
    items:
      type: string
    uniqueItems: true
  links:
    type: array
    items:
      type: object
      required:
      - relation
      - target_id
      properties:
        relation:
          type: string
        target_id:
          type: string
      additionalProperties: false
  claim:
    type: string
  claim_type:
    enum:
    - factual
    - interpretive
    - experiential
    - spiritual
    - predictive
    - normative
  review_state:
    enum:
    - proposed
    - researched
    - approved
    - rejected
    - needs_revision
  evidence_confidence:
    enum:
    - high
    - medium
    - low
    - unknown
    - not_applicable
  evidence_ids:
    type: array
    items:
      type: string
  limitations:
    type: array
    items:
      type: string
  approved_for_publication:
    type: boolean
additionalProperties: false
